[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "aakaar"
version = "0.1.2"
description = "A custom CUDA-accelerated ML library"
readme = "README.md"
authors = [{name = "Aarav Aggarwal"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "nvidia-curand-cu12",
    "nvidia-cuda-runtime-cu12",
]