# .readthedocs.yaml
# Read the Docs configuration
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# We tell Read the Docs to install our tool via pip
python:
  install:
    - requirements: docs/requirements.txt

# We define a custom build command to use zensical instead of mkdocs
commands:
  build:
    - zensical build --site-dir $READTHEDOCS_OUTPUT/html