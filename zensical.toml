]

[project.theme]
variant = "modern"
name = "material"
logo = "assets/aakaar_logo.png"
favicon = "assets/aakaar_logo.png"

# --- Unified Color Configuration & Mode Toggles ---

# --- Light Mode ---
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

# --- Dark Mode ---
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.extra]
generator = false
# Copy-to-clipboard and other professional features
features = [
  "navigation.tabs",
  "navigation.sections",
  "content.code.copy",
  "navigation.instant" 
]