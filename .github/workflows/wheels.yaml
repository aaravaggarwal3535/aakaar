name: Build Linux Wheels

on:
  push:
    tags:
      - 'v*'

jobs:
  build_linux_wheels:
    name: Build wheels on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist
        env:
          # 1. Target exactly Python 3.10, 3.11, 3.12, and 3.14
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp314-manylinux_x86_64"
          
          # 2. Use the AlmaLinux 8 container (supports modern CUDA)
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          # 3. Inject CUDA 12.4 before compiling your C++ code
          CIBW_BEFORE_ALL_LINUX: >
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean all &&
            dnf -y install cuda-toolkit-12-4

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda-wheels
          path: ./dist/*.whl