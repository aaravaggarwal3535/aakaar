name: Build Wheels

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a version tag like v1.0.0

jobs:
  build_wheels:
    name: Build wheels on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist
        env:
          # Target your specific Python versions for standard 64-bit Linux
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp314-manylinux_x86_64"
          
          # Tell cibuildwheel to use the modern manylinux_2_28 image (AlmaLinux 8)
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          # Install CUDA Toolkit 12.4 inside the container before compiling
          CIBW_BEFORE_ALL_LINUX: >
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean all &&
            dnf -y install cuda-toolkit-12-4

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels
          path: ./dist/*.whl