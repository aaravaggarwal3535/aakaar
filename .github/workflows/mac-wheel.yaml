name: Build macOS Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_macos_arm64:
    name: Build wheels on macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS (via Homebrew)
        run: brew install openblas
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist
        env:
          CIBW_BUILD: "cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CPATH=/opt/homebrew/opt/openblas/include
            LIBRARY_PATH=/opt/homebrew/opt/openblas/lib
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-listdeps {wheel} && delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wheels
          path: ./dist/*.whl

  build_macos_x86_64:
    name: Build wheels on macOS (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS (via Homebrew)
        run: brew install openblas
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: dist
        env:
          CIBW_BUILD: "cp310-macosx_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64 cp313-macosx_x86_64 cp314-macosx_x86_64"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=13.0
            CPATH=/usr/local/opt/openblas/include
            LIBRARY_PATH=/usr/local/opt/openblas/lib
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-listdeps {wheel} && delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-wheels
          path: ./dist/*.whl